# Publishes the documentation site to GitHub Pages: https://melhzy.github.io/pubmed-stream/
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - mkdocs.yml
      - docs/**
      - tutorials/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - mkdocs.yml
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
