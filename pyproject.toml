[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmed-stream"
version = "0.4.1"
description = "Download PubMed Central full-text articles via NCBI E-utilities API. Built for biomedical research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Haran Lab, Bucci Lab, and Microbiology & Microbiome Dynamics AI HUB" }
]
maintainers = [
    { name = "University of Massachusetts" }
]
keywords = ["pubmed", "pmc", "ncbi", "e-utilities", "literature", "download", "biomedical", "research", "knowledge-graph", "obsidian", "mesh", "citation-network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
tutorials = ["jupyter", "matplotlib", "networkx", "pandas"]

[project.scripts]
pubmed-stream = "pubmed_stream.cli:main"

[project.urls]
Repository = "https://github.com/melhzy/pubmed-stream"
Homepage = "https://github.com/melhzy/pubmed-stream"
Documentation = "https://melhzy.github.io/pubmed-stream/"
"Bug Tracker" = "https://github.com/melhzy/pubmed-stream/issues"

[tool.setuptools.packages.find]
include = ["pubmed_stream*"]

[tool.setuptools.package-data]
pubmed_stream = ["py.typed", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tutorials import their helpers after putting the tutorials folder on sys.path
"tutorials/*.ipynb" = ["E402", "E741"]
