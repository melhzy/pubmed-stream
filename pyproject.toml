[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmed-stream"
dynamic = ["version"]
description = "Literature searches in PubMed and PubMed Central for researchers and their AI assistants: full texts, the evidence around a paper and an Obsidian knowledge graph, with an MCP server and a plugin for Claude Code and Codex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Haran Lab, Bucci Lab, and Microbiology & Microbiome Dynamics AI HUB" }
]
maintainers = [
    { name = "University of Massachusetts" }
]
keywords = ["pubmed", "pmc", "ncbi", "e-utilities", "literature", "literature-review", "biomedical", "research",
            "knowledge-graph", "obsidian", "mesh", "citation-network", "retraction", "mcp", "mcp-server",
            "model-context-protocol", "claude-code", "codex", "gemini-cli", "ai-assistant", "llm", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
tutorials = ["jupyter", "matplotlib", "networkx", "pandas"]

[project.scripts]
pubmed-stream = "pubmed_stream.cli:main"

[project.urls]
Repository = "https://github.com/melhzy/pubmed-stream"
Homepage = "https://github.com/melhzy/pubmed-stream"
Documentation = "https://melhzy.github.io/pubmed-stream/"
"Bug Tracker" = "https://github.com/melhzy/pubmed-stream/issues"

[tool.setuptools.dynamic]
version = {attr = "pubmed_stream.__version__"}

[tool.setuptools.packages.find]
include = ["pubmed_stream*"]

[tool.setuptools.package-data]
pubmed_stream = ["py.typed", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tutorials import their helpers after putting the tutorials folder on sys.path
"tutorials/*.ipynb" = ["E402", "E741"]
